# release-automation/.github/workflows/pr-validate.yml

name: Flow 2 - PR & JIRA Ticket Validation

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      pr_title:
        type: string
        required: true
      pr_body:
        type: string
        required: false
        default: ''
      repo_name:
        type: string
        required: true
    secrets:
      JIRA_BASE_URL:      { required: true }
      JIRA_EMAIL:         { required: true }
      JIRA_API_TOKEN:     { required: true }
      JIRA_PROJECT_KEY:   { required: true }
      GH_TOKEN:           { required: true }
      GH_ORG:             { required: true }
      CONFLUENCE_BASE_URL:       { required: false }
      CONFLUENCE_EMAIL:          { required: false }
      CONFLUENCE_API_TOKEN:      { required: false }
      CONFLUENCE_SPACE_KEY:      { required: false }
      CONFLUENCE_PARENT_PAGE_ID: { required: false }
      OPENAI_API_KEY:            { required: false }

jobs:
  validate-ticket:
    name: Validate JIRA ticket fields
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hub repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/release-automation
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - name: Build                          # ← add this step
        run: pnpm build
      
      - name: Validate JIRA ticket
        run: node dist/scripts/validatePR.js
        env:
          PR_NUMBER:   ${{ inputs.pr_number }}
          PR_TITLE:    ${{ inputs.pr_title }}
          PR_BODY:     ${{ inputs.pr_body }}
          REPO:        ${{ inputs.repo_name }}
          JIRA_BASE_URL:    ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:       ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:   ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          CONFLUENCE_BASE_URL:        ${{ secrets.CONFLUENCE_BASE_URL || 'https://placeholder.atlassian.net/wiki' }}
          CONFLUENCE_EMAIL:           ${{ secrets.CONFLUENCE_EMAIL || 'placeholder@example.com' }}
          CONFLUENCE_API_TOKEN:       ${{ secrets.CONFLUENCE_API_TOKEN || 'placeholder' }}
          CONFLUENCE_SPACE_KEY:       ${{ secrets.CONFLUENCE_SPACE_KEY || 'PLACEHOLDER' }}
          CONFLUENCE_PARENT_PAGE_ID:  ${{ secrets.CONFLUENCE_PARENT_PAGE_ID || '0' }}
          GH_TOKEN:    ${{ secrets.GH_TOKEN }}
          GH_ORG:      ${{ secrets.GH_ORG }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder' }}